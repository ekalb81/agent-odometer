# Weekly, grouped dependency updates — one PR per ecosystem for
# minor/patch bumps keeps the noise low; majors get their own PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The MSRV job installs the version declared by Cargo.toml through the
    # stable action entrypoint. A Dependabot action-ref bump must never change
    # the compiler compatibility floor being tested.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
