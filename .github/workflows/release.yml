name: Release

# Triggers a cross-platform Tauri build when you push a tag like `v0.1.0`.
# Produces installers for Windows (MSI + NSIS), macOS arm64 (DMG), and Linux
# (deb + AppImage), and attaches them to a DRAFT GitHub Release that you
# review and publish manually.
#
# Manual trigger (workflow_dispatch) is a build-only dry run. It never derives
# a release tag from the selected branch and never creates or uploads a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Never let retries for the same tag race to create or upload one release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release versions
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify package versions and release tag
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          tauri_version="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version)')"
          cargo_version="$(awk -F '=' '
            /^\[package\][[:space:]]*$/ { in_package = 1; next }
            /^\[/ { if (in_package) exit }
            in_package && $1 ~ /^[[:space:]]*version[[:space:]]*$/ {
              value = $2
              gsub(/[[:space:]"]/, "", value)
              print value
              exit
            }
          ' src-tauri/Cargo.toml)"

          if [[ -z "$package_version" || -z "$cargo_version" || -z "$tauri_version" ]]; then
            echo "::error::Could not read all release versions"
            exit 1
          fi

          if [[ "$package_version" != "$cargo_version" || "$package_version" != "$tauri_version" ]]; then
            echo "::error::Version mismatch: package.json=$package_version Cargo.toml=$cargo_version tauri.conf.json=$tauri_version"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            expected_tag="v${package_version}"
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' must exactly match '$expected_tag'"
              exit 1
            fi
          fi

          echo "Release version verified: $package_version"

      - name: Verify tagged commit passed CI
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          successful_run_id="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | first | .id // empty'
          )"

          if [[ -z "$successful_run_id" ]]; then
            echo "::error::The tagged commit ${GITHUB_SHA} does not have a successful completed CI run. Wait for CI to pass, then rerun this release workflow."
            exit 1
          fi

          echo "Tagged commit passed CI in run ${successful_run_id}."

      - name: Ensure mutable draft release
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # GitHub's releases/tags endpoint does not return draft releases.
          # Enumerate releases and make one mutable draft for the serialized
          # publisher that runs after all platform builds finish.
          mapfile -t matches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | [.id, .draft, .immutable, .target_commitish] | @tsv"
          )

          if (( ${#matches[@]} > 1 )); then
            echo "::error::Multiple releases already use tag ${GITHUB_REF_NAME}; remove the duplicates before retrying."
            exit 1
          fi

          if (( ${#matches[@]} == 1 )); then
            IFS=$'\t' read -r release_id draft immutable target_commitish <<< "${matches[0]}"
            if [[ "$draft" != 'true' || "$immutable" == 'true' || "$target_commitish" != "$GITHUB_SHA" ]]; then
              echo "::error::Release ${GITHUB_REF_NAME} is not the expected mutable draft (draft=${draft}, immutable=${immutable}, target=${target_commitish})."
              exit 1
            fi
            echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
            echo "Using mutable draft release ${release_id} for ${GITHUB_REF_NAME}."
            exit 0
          fi

          release_notes="$(
            printf '%s\n' \
              '## Installation' \
              '' \
              'Download the installer for your platform:' \
              '' \
              '- **Windows**: the `.msi` (recommended) or `.exe`.' \
              '- **macOS (Apple Silicon)**: the `.dmg`. Right-click → Open on first launch (the app is not notarized yet).' \
              '- **Linux**: the `.AppImage` (single file, no install) or `.deb` (Debian/Ubuntu).' \
              '' \
              'Installed copies check for new releases on launch and offer a one-click update.'
          )"
          release_id="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Odometer ${GITHUB_REF_NAME}" \
              -f body="$release_notes" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true \
              --jq '.id'
          )"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "Created mutable draft release ${release_id} for ${GITHUB_REF_NAME}."

  build:
    name: ${{ matrix.platform }} — ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      # Bundling is isolated per OS. Only the downstream publisher mutates the
      # draft release, so these expensive platform builds can safely overlap.
      max-parallel: 3
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            artifact_name: release-bundles-macos
          - platform: ubuntu-22.04
            label: Linux (x86_64)
            args: ''
            rust_target: ''
            artifact_name: release-bundles-linux
          - platform: windows-latest
            label: Windows (x86_64)
            args: ''
            rust_target: ''
            artifact_name: release-bundles-windows

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # Make sure caches are scoped per OS+target.
          key: ${{ matrix.platform }}-${{ matrix.rust_target }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            patchelf \
            file

      - name: Install frontend deps
        run: npm ci

      - name: Build and sign bundles
        uses: tauri-apps/tauri-action@v1
        env:
          # createUpdaterArtifacts exercises updater signing for both release
          # tags and manual dry runs. Publishing happens in one later job.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Do not provide releaseId or tagName. Tauri Action would otherwise
          # generate and overwrite latest.json once per matrix entry.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Preserve signed release bundles for the publisher
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish signed release assets
    if: github.event_name == 'push'
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download signed platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: release-bundles-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload release assets and assemble updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          set -euo pipefail

          package_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          node scripts/release-artifacts.mjs release-artifacts "$package_version" > release-assets.txt
          mapfile -t release_assets < release-assets.txt
          gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          node scripts/assemble-updater-manifest.mjs \
            release-artifacts \
            release.json \
            "$package_version" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" \
            latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber

  validate:
    name: Validate updater release
    if: github.event_name == 'push'
    needs: [preflight, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate draft assets and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
        run: |
          set -euo pipefail

          matching_releases="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id"
          )"
          if [[ "$(printf '%s\n' "$matching_releases" | sed '/^$/d' | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one release for ${GITHUB_REF_NAME}."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          latest_asset_id="$(
            jq -r '[.assets[] | select(.name == "latest.json")] | if length == 1 then .[0].id else empty end' release.json
          )"
          if [[ -z "$latest_asset_id" ]]; then
            echo "::error::Expected exactly one latest.json asset."
            exit 1
          fi
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${latest_asset_id}" > latest.json

          package_version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          node scripts/validate-updater-manifest.mjs \
            latest.json \
            release.json \
            "$package_version" \
            "$GITHUB_SHA"
