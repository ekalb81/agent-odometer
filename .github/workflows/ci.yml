name: CI

# Runs the full validation path on every PR and on pushes to main. Verifies that:
#   - the frontend type-checks (svelte-check)
#   - the frontend unit and component tests pass (Vitest)
#   - the frontend builds (vite build)
#   - the Rust crate is formatted and passes strict Clippy
#   - all Rust tests pass (cargo test)
#   - the crate builds under the declared MSRV
#   - Rust test coverage is measured
# MSRV and Coverage run on pull requests too, not just main pushes, so a PR
# cannot go green on a config that then turns main red once merged. Measured
# job durations (see PR description) show both run comfortably inside the
# wall-clock time the "Check + test" job already takes, since all jobs run
# concurrently and reuse the same swatinem/rust-cache keys. Coverage uploads
# to Codecov using GitHub OIDC and are only functional while the repository
# is public; the upload step is intentionally non-blocking (continue-on-error,
# fail_ci_if_error: false) so an authentication failure — e.g. from a fork PR
# without OIDC access — never fails the job. The coverage *measurement*
# (cargo llvm-cov) still gates.
#
# Runs on Linux only — these checks are platform-independent and Linux is
# the fastest GitHub-hosted runner. The release workflow handles the
# multi-OS bundle build.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_cargo_cache_probe:
        description: 'Also compare warm registry-only and target-directory Cargo caches.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Lets the Codecov upload authenticate via GitHub OIDC instead of a token.
  id-token: write

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check + test
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ci-linux

      - name: Install Linux system deps
        uses: ./.github/actions/linux-deps

      - name: Install frontend deps
        run: npm ci

      - name: Frontend type-check
        run: npm run check

      - name: Frontend tests and coverage gate
        run: npm run test:coverage

      - name: Updater manifest validator tests
        run: npm run check:updater-manifest

      - name: Frontend build
        run: npm run build

      - name: Rust format check
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Rust lint (clippy)
        working-directory: ./src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: ./src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test-output.txt

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Rust test results"
            echo
            echo '| Suite | Result |'
            echo '| --- | --- |'
            awk '/^     Running |^   Doc-tests / { suite=$2; sub(/\(.*/, "", suite) }
                 /^test result:/ { gsub(/;/, "", $0); printf("| `%s` | %s passed, %s failed |\n", suite, $4, $6) }' \
              src-tauri/test-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

  visual-regression:
    name: Visual regression
    # Keep this job present on every PR/push so the check has a stable status.
    # The Chromium install and browser work are skipped when the changed paths
    # cannot affect the rendered frontend.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Determine visual impact
        id: impact
        run: node scripts/visual-impact.mjs --github-output "$GITHUB_OUTPUT"

      - name: Run visual regression in pinned container
        if: steps.impact.outputs.impacted == 'true'
        run: |
          docker run --rm --ipc=host \
            --volume "$GITHUB_WORKSPACE:/work" \
            --mount type=volume,target=/work/node_modules \
            --workdir /work \
            mcr.microsoft.com/playwright:v1.62.0-jammy@sha256:b012874f829d298730411256666afcaeaeebaf505a0cf4c2f668d6dedb3d1e80 \
            bash -lc '
              set -e
              npm ci
              if ! npm run visual:test; then
                npm run visual:gallery || true
                exit 1
              fi
            '

      - name: Report visual check
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.impact.outputs.impacted }}" == "true" ]]; then
            echo "Visual regression ran (or produced artifacts after a failure)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Visual regression skipped: no UI-impacting paths changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual artifacts
        if: failure() && steps.impact.outputs.impacted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-${{ github.run_id }}
          if-no-files-found: warn
          path: output/playwright/**
          retention-days: 7

  msrv:
    name: Minimum supported Rust
    # Runs on pull requests too: a PR that only exercises stable Rust can
    # still merge an MSRV-breaking change, which then fails on the next
    # push to main. Measured at ~50-56s on recent pushes, well under the
    # "Check + test" job it runs alongside, so it does not lengthen PR
    # wall-clock time.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read declared MSRV
        id: msrv
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::src-tauri/Cargo.toml must declare package.rust-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup declared MSRV
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Report installed MSRV
        shell: bash
        run: |
          rustc --version
          installed="$(rustc --version | awk '{print $2}')"
          declared="${{ steps.msrv.outputs.version }}"
          case "$installed" in
            "$declared"|"$declared".*) ;;
            *) echo "::error::Expected Rust $declared.x, installed $installed."; exit 1 ;;
          esac

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: msrv-linux-${{ steps.msrv.outputs.version }}

      - name: Install Linux system deps
        uses: ./.github/actions/linux-deps

      - name: Check declared MSRV
        working-directory: ./src-tauri
        run: cargo check --locked

  coverage:
    name: Coverage
    # Runs on pull requests too, so a coverage regression is visible before
    # merge rather than only after. The Codecov *upload* stays informational
    # (continue-on-error, fail_ci_if_error: false below) since it depends on
    # GitHub OIDC and only authenticates while the repo is public — a PR
    # context where that fails must not fail this job. Measured at ~2m16s-2m22s
    # on recent pushes, under the "Check + test" job it runs alongside.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: coverage-linux

      - name: Install Linux system deps
        uses: ./.github/actions/linux-deps

      - name: Coverage
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info
          {
            echo "## Rust coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: src-tauri/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  cargo-cache-probe:
    name: Cargo cache probe (${{ matrix.cache_targets && 'target' || 'registry-only' }})
    # The normal lane retains its proven target cache. This opt-in experiment
    # produces directly comparable timings before changing that policy.
    if: github.event_name == 'workflow_dispatch' && inputs.run_cargo_cache_probe
    strategy:
      fail-fast: false
      matrix:
        cache_targets: [true, false]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: cargo-cache-probe-${{ matrix.cache_targets }}
          cache-targets: ${{ matrix.cache_targets }}

      - name: Install Linux system deps
        uses: ./.github/actions/linux-deps

      - name: Measure Cargo tests
        working-directory: ./src-tauri
        shell: bash
        run: |
          set -euo pipefail
          started_at="$SECONDS"
          cargo test --locked
          elapsed_seconds=$((SECONDS - started_at))
          {
            echo "## Cargo cache probe"
            echo
            echo "- Target directory cached: \`${{ matrix.cache_targets }}\`"
            echo "- \`cargo test --locked\`: ${elapsed_seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"
