[package]
name = "agent-odometer"
version = "0.8.11"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[lib]
name = "odometer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "agent-odometer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml_edit      = "0.25"
chrono         = { version = "0.4", features = ["serde"] }
base64         = "0.22"
notify         = "8"
notify-debouncer-full = "0.7"   # pairs with notify 8.x
dashmap        = "6"
anyhow         = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs           = "6"
walkdir        = "2"
rayon          = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
gix = { version = "0.86", default-features = false, features = ["sha1"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tauri-plugin-opener = "2"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true

[dev-dependencies]
chacha20poly1305 = "0.11.0"
